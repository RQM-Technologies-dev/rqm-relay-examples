name: Buyer integration support
description: Report installation, protocol, or recovery problems without confidential data.
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: "This is public. Never include keys, payment signatures, bearer tokens, recovery files, customer inputs, or results. Keep an uncertain purchase's original recovery file; do not pay again."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command name, Node version, HTTP status or public error code, and expected behavior. Redact local paths and identifiers.
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Capability ID
  - type: input
    id: version
    attributes:
      label: Example release or commit
