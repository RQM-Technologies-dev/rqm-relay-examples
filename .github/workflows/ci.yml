name: Buyer kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix connectors/claude-desktop
      - run: npm run pack --prefix connectors/claude-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: rqm-jobs-discovery-mcpb
          path: connectors/claude-desktop/rqm-jobs-discovery.mcpb
